name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for Node project
        id: has_node
        run: |
          if [ -f package.json ]; then echo "present=true" >> $GITHUB_OUTPUT; else echo "present=false" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-node@v4
        if: steps.has_node.outputs.present == 'true'
        with:
          node-version: 20
      - name: Install deps
        if: steps.has_node.outputs.present == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund || npm install
      - name: Build
        if: steps.has_node.outputs.present == 'true'
        run: npm run build --if-present
      - name: Skip
        if: steps.has_node.outputs.present == 'false'
        run: echo "No package.json; skipping Node build."